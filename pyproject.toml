[project]
name = "sitemap-monitor"
version = "0.1.0"
description = "Monitor sitemap changes across configured sites"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper>=1.2.71",
    "fastapi>=0.141.1",
    "libsql>=0.1.11",
    "lxml>=6.1.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
