# Sitemap 监控工作流：定时或手动拉取 sitemap，结果写入 Turso
name: Sitemap Monitor

on:
  # 推送到 main 且相关文件变更时触发
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'config.yaml'
      - '*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  # 定时执行（GitHub cron 为 UTC）
  # GitHub 官方明确提到，scheduled workflows 在整点附近可能因为高负载出现延迟，甚至可能被丢弃。
  schedule:
    - cron: '11 22 * * *'  # 北京时间 06:00
    - cron: '11 3 * * *'   # 北京时间 12:00，防止排队提前一个小时
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # 安装 uv，并启用依赖缓存
    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: '3.12'

    # 按 pyproject.toml / uv.lock 安装依赖
    - name: Install dependencies
      run: uv sync --frozen --no-dev

    # 执行 sitemap 监控主脚本（数据写入 Turso，不再回写仓库）
    - name: Run Monitor
      env:
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      run: uv run python main.py
