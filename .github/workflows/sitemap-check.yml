# Sitemap 监控工作流：定时或手动拉取 sitemap，对比变更后回写仓库
name: Sitemap Monitor

on:
  # 推送到 main 且相关文件变更时触发
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'config.yaml'
      - '*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  # 定时执行（GitHub cron 为 UTC）
  schedule:
    - cron: '0 22 * * *'  # 北京时间 06:00
    - cron: '0 4 * * *'   # 北京时间 12:00
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    # 拉取仓库代码；不持久化凭据，后续用 GH_TOKEN 推送
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # 安装 uv，并启用依赖缓存
    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: '3.12'

    # 按 pyproject.toml / uv.lock 安装依赖
    - name: Install dependencies
      run: uv sync --frozen --no-dev

    # 执行 sitemap 监控主脚本
    - name: Run Monitor
      run: uv run python main.py

    # 若有数据变更则提交并推送回仓库
    - name: Commit changes
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}  # 需在仓库 Secrets 中配置
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        # 无变更则跳过；有变更则提交并推送
        git diff --quiet && git diff --staged --quiet || (git commit -m "📦 Update sitemap data: $(date +'%Y-%m-%d')" && git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git)
